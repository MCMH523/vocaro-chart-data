name: deriv-search
# Searches YouTube for the Korean covers / Korean-IP fan works of the songs in deriv/req.json (see scripts/deriv_search.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [deriv/req.json, scripts/deriv_search.py, .github/workflows/deriv-search.yml]
concurrency:
  group: deriv-search
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: python3 scripts/deriv_search.py
      - name: Commit
        run: |
          git config user.name "vocaro-bot"
          git config user.email "vocaro-bot@users.noreply.github.com"
          git add data/deriv_candidates.json
          git commit -m "2차창작 candidates $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
