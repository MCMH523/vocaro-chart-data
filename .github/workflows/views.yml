name: fetch view counts

on:
  schedule:
    - cron: "1,11 * * * *"   # :01 and a backup at :11 (GitHub may start late or skip a scheduled run)
  workflow_dispatch:
  push:                   # a changed song list is fetched right away
    branches: [main]
    paths: [songs.json, tick.txt, scripts/fetch_views.py, scripts/fetch_thumbs.py, .github/workflows/views.yml]   # the hourly Claude task pushes tick.txt to ask for a fresh reading

permissions:
  contents: write

concurrency:
  group: views
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fetch_views.py
      - name: Thumbnails for new songs
        continue-on-error: true   # a thumbnail problem must never hold back the view counts
        run: |
          python3 -m pip install -q pillow
          python3 scripts/fetch_thumbs.py
      - name: Inst / Korean version candidates for new songs
        continue-on-error: true   # never holds back the view counts
        timeout-minutes: 2
        run: python3 scripts/alt_candidates.py --max 4
      - name: Commit
        run: |
          git config user.name "vocaro-bot"
          git config user.email "vocaro-bot@users.noreply.github.com"
          git add data/latest.json data/thumbs data/alt_candidates.json
          git commit -m "views $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
