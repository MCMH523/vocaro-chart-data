name: fetch view counts

on:
  schedule:
    - cron: "1 * * * *"   # every hour at :01 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: views
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fetch_views.py
      - name: Commit
        run: |
          git config user.name "vocaro-bot"
          git config user.email "vocaro-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "views $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
