name: fetch view counts

on:
  schedule:
    - cron: "1,11 * * * *"   # :01 and a backup at :11 (GitHub may start late or skip a scheduled run)
  workflow_dispatch:
  push:                   # a changed song list is fetched right away
    branches: [main]
    paths: [songs.json, scripts/fetch_views.py, .github/workflows/views.yml]

permissions:
  contents: write

concurrency:
  group: views
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fetch_views.py
      - name: Commit
        run: |
          git config user.name "vocaro-bot"
          git config user.email "vocaro-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "views $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
