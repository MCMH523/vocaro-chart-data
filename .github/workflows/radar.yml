name: new-song-radar
# Looks for new uploads on the channels of songs already in the chart (see scripts/radar.py).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
concurrency:
  group: radar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/radar.py
      - name: Commit
        run: |
          git config user.name "vocaro-bot"
          git config user.email "vocaro-bot@users.noreply.github.com"
          git add data/radar.json
          git commit -m "radar $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
